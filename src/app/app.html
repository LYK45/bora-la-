<div class="app-container" [class.has-sidebar]="showSidebar">
  @if (showSidebar) {
  <aside class="sidebar">
    <div class="logo">Bora Lá?</div>

    <nav class="menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="menu-item">
        <span class="icon">📊</span> Dashboard
      </a>
      <a routerLink="/transactions" routerLinkActive="active" class="menu-item">
        <span class="icon">💸</span> Transações
      </a>
      <a routerLink="/goals" routerLinkActive="active" class="menu-item">
        <span class="icon">🎯</span> Metas
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="menu-item">
        <span class="icon">👤</span> Perfil
      </a>
    </nav>

    <button (click)="logout()" class="logout-btn">
      <span class="icon">🚪</span> Sair
    </button>
  </aside>
  }

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
