<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <a routerLink="/" class="logo-link">Bora Lá?</a>
      <h2>Recuperar Senha</h2>
      <p>Insira o seu e-mail cadastrado para receber um link de redefinição</p>
    </div>

    @if (successMessage) {
    <div class="success-banner">
      {{ successMessage }}
    </div>
    <div class="auth-footer" style="margin-top: 24px;">
      <a routerLink="/login" class="btn-primary" style="display: block; text-align: center;">Voltar para o Login</a>
    </div>
    } @else {
    <form [formGroup]="recoveryForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" placeholder="seuemail@exemplo.com"
          [class.error]="isFieldInvalid('email')" />
        @if (isFieldInvalid('email')) {
        <span class="error-text">Insira um e-mail válido</span>
        }
      </div>

      <button type="submit" [disabled]="recoveryForm.invalid" class="btn-submit">Enviar Link de Recuperação</button>
    </form>

    <div class="auth-footer">
      <p>Lembrou a senha? <a routerLink="/login">Voltar para o login</a></p>
    </div>
    }
  </div>
</div>
